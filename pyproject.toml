[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a6400-film-lab"
version = "1.0.0"
description = "Offline film-look editor for Sony a6400 RAW and common image formats"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.scripts]
film-lab = "film_lab.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["film_lab*"]

[tool.setuptools.package-data]
film_lab = ["data/profiles/*/*", "data/profiles/LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
